[workspace]
members = ["whisper-rs", "carbon-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
axum = "0.8"
toml = "0.8"
regex = "1"
prost = "0.14"
crc32fast = "1"
flate2 = "1"
tempfile = "3"
prometheus = { version = "0.14", features = ["process"] }
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
