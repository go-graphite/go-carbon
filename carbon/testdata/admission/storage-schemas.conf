
[_aggregations__secondly__bplatform_________by_persona_cluster_pod__]
pattern = ^aggregations\.secondly\.bplatform\.[^.]+\.by_persona_cluster_pod\.
retentions = 10s:3d

[_aggregations__secondly__bplatform_________per_env_________per_cluster__]
pattern = ^aggregations\.secondly\.bplatform\.[^.]+\.per_env\.[^.]+\.per_cluster\.
retentions = 10s:3d

[_aggregations__secondly______by_persona_cluster_pod__]
pattern = ^aggregations\.secondly\..+\.by_persona_cluster_pod\.
retentions = 1s:1d

[_aggregations___minutely_hourly___capacityservice__bplatform__secondly______pods__per_persona__]
pattern = ^aggregations\.(minutely|hourly)\.capacityservice\.bplatform\.secondly\..+\.pods\.per_persona\.
retentions = 1s:1d

[__secondly__1d__]
pattern = \.secondly\.1d\.
retentions = 1s:1d

[__secondly__]
pattern = \.secondly\.
retentions = 1s:1d,1m:30d,1h:1y,1d:10y

[__ten_secondly__]
pattern = \.ten_secondly\.
retentions = 10s:2d,1m:14d,30m:2y

[__minutely__]
pattern = \.minutely\.
retentions = 1m:30d,1h:1y,1d:10y

[__five_minutely__]
pattern = \.five_minutely\.
retentions = 5m:1y

[__ten_minutely__]
pattern = \.ten_minutely\.
retentions = 10m:1y,1d:10y

[__fifteen_minutely__]
pattern = \.fifteen_minutely\.
retentions = 15m:1y

[__half_hourly__]
pattern = \.half_hourly\.
retentions = 30m:3y

[__hourly__]
pattern = \.hourly\.
retentions = 1h:10y

[__two_hourly__]
pattern = \.two_hourly\.
retentions = 2h:10y

[__twelve_hourly__]
pattern = \.twelve_hourly\.
retentions = 12h:10y

[__daily__]
pattern = \.daily\.
retentions = 1d:10y

[__]
pattern = .*
retentions = 1m:14d,30m:2y
